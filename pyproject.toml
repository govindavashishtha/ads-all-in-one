[project]
name = "ads-autopilot"
version = "0.1.0"
description = "Self-hosted Meta + Google Ads autopilot (see docs/BUILD_PLAN.md v1.1)"
requires-python = ">=3.12,<3.13"
# Exact pins (plan §4.1, §5). Record SDK + platform API versions in docs/VERSIONS.md.
dependencies = [
  "sqlalchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.8",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "fastapi==0.162.4",
  "uvicorn[standard]==0.54.0",
  "apscheduler==3.11.3",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "simpleeval==1.0.8",
  "typer==0.29.1",
  "httpx==0.28.1",
  "structlog==26.1.0",
  "prometheus-client==0.26.0",
  "argon2-cffi==25.1.0",
  "pyyaml==6.0.3",
  "facebook-business==26.0.4",   # VERIFY-P0: confirm matches META_API_VERSION
  "google-ads==35.0.0",          # VERIFY-P0: confirm supported Google Ads API version
]

[project.optional-dependencies]
ga4 = ["google-analytics-data==0.23.3"]

[project.scripts]
ads = "cli.ads:app"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "hypothesis==6.170.15",
  "ruff==0.17.4",
  "mypy==2.4.1",
  "types-pyyaml==6.0.12.20261111",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "api", "cli"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dashboard", "db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF", "SIM", "PL"]
ignore = ["PLC0415", "PLR0913", "PLR2004", "S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "DTZ"]
"db/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["engine", "api", "cli", "tests"]
exclude = ["db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["facebook_business.*", "google.ads.*", "google.analytics.*", "simpleeval", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
  "integration: needs a real Postgres (TEST_DATABASE_URL)",
  "contract: replays recorded SDK fixtures",
]
