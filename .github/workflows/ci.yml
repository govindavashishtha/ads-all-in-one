name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ads
          POSTGRES_PASSWORD: ads
          POSTGRES_DB: ads_autopilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ads -d ads_autopilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ads:ads@127.0.0.1:5432/ads_autopilot_test
      DATABASE_URL: postgresql+psycopg://ads:ads@127.0.0.1:5432/ads_autopilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - run: uv python install 3.12
      - run: make setup
      - run: make lint
      - name: migrations (upgrade, downgrade, upgrade, drift check)
        run: |
          uv run alembic -c db/alembic.ini upgrade head
          uv run alembic -c db/alembic.ini downgrade base
          uv run alembic -c db/alembic.ini upgrade head
          uv run alembic -c db/alembic.ini check
      - run: make test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker run --rm -v "$PWD/proxy:/etc/caddy:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
